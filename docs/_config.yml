---
title: Chuck Nemeth - Legacy Technical Wiki
description: Archived technical notes and documentation

# Temporary GitHub Pages URL
url: "https://chuckn246.github.io"
baseurl: "/wiki-archive"

# Documentation theme
remote_theme: just-the-docs/just-the-docs@v0.12.0

markdown: kramdown
search_enabled: true
nav_sort: case_insensitive

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      nav_exclude: true

# vim: ft=yaml ts=2 sts=-1 sw=2 et
